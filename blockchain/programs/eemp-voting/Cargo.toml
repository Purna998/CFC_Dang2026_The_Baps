[package]
name = "eemp-voting"
version = "0.1.0"
description = "EEMP Vote Commitment and Verification Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "eemp_voting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.0"
anchor-spl = "0.30.0"
solana-program = "2.0"

[dev-dependencies]
solana-program-test = "2.0"
solana-sdk = "2.0"
spl-token = { version = "6.0", features = ["no-entrypoint"] }
