[workspace]
resolver = "2"

members = [
    "services/api-gateway",
    "services/organization-service",
    "services/auth-service",
    "services/election-service",
    "services/voting-service",
    "services/candidate-service",
    "services/result-service",
    "services/audit-service",
    "services/crypto-service",
    "services/blockchain-service",
    "shared/domain",
    "shared/error",
    "shared/config",
    "shared/database",
    "shared/observability",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["EEMP Team"]
license = "Proprietary"

[workspace.dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "compression-gzip"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# Authentication & Cryptography
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
ed25519-dalek = "2"
x25519-dalek = "2"
aes-gcm = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# UUID & Time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.26"

# Error handling
thiserror = "1"
anyhow = "1"

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# TOTP (MFA)
totp-rs = "5"

# Encoding
base64 = "0.22"
hex = "0.4"

# Solana SDK for blockchain
solana-sdk = "1.18"
solana-client = "1.18"
anchor-client = "0.29"

# Rate limiting
governor = "0.6"

# Configuration
config = "0.14"

# Testing
mockall = "0.13"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 0
