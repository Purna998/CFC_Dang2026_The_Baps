version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eemp-postgres
    environment:
      POSTGRES_USER: eemp
      POSTGRES_PASSWORD: eemp_dev_password
      POSTGRES_DB: eemp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eemp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eemp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Solana local validator (for blockchain testing)
  solana:
    image: solanalabs/solana:latest
    container_name: eemp-solana
    command: solana-test-validator --no-bpf-jit
    ports:
      - "8899:8899"   # RPC
      - "8900:8900"   # PubSub
      - "9900:9900"   # Faucet
    volumes:
      - solana_data:/root/.config/solana

  # pgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eemp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eemp.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # RedisInsight (optional - for Redis management)
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: eemp-redis-insight
    ports:
      - "8001:8001"
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  solana_data:

networks:
  default:
    name: eemp-network
